
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REFACCIONARIA AGCM | Administrador</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-inventario">

    <header class="encabezado">
        <h1>REFACCIONARIA AGCM</h1>
        <p>Panel de administración de inventario</p>
        <span class="etiqueta-rol">ADMINISTRADOR</span>
    </header>

    <main class="contenido">

        <section class="panel">
            <h2>Inventario de productos</h2>

            <p id="mensaje">Cargando inventario...</p>

            <div id="productos" class="lista-productos"></div>
        </section>

        <section class="panel">
            <h2>Agregar nuevo producto</h2>

            <p class="descripcion">
                Registra un producto nuevo en el inventario.
            </p>

            <form id="formProducto">

                <label for="nombreProducto">
                    Nombre del producto
                </label>
                <input
                    type="text"
                    id="nombreProducto"
                    placeholder="Ej. Llantas para automóvil"
                    required
                >

                <label for="stockProducto">
                    Cantidad en stock
                </label>
                <input
                    type="number"
                    id="stockProducto"
                    placeholder="Ej. 25"
                    min="0"
                    step="1"
                    required
                >

                <label for="precioProducto">
                    Precio del producto ($)
                </label>
                <input
                    type="number"
                    id="precioProducto"
                    placeholder="Ej. 1500"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Agregar producto
                </button>

            </form>

            <p id="mensajeProducto"></p>
        </section>

    </main>

    <footer class="pie">
        REFACCIONARIA AGCM · Sistema de inventario
    </footer>

    <script src="../js/inventario.js"></script>
    <script src="../js/administrador.js"></script>

</body>
</html>
