
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REFACCIONARIA AGCM | Almacenista</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-inventario" data-rol="almacenista">

    <header class="encabezado">
        <img
            src="../img/logo jpg.png"
            width="130"
            alt="Logo REFACCIONARIA AGCM"
        >

        <h1>REFACCIONARIA AGCM</h1>
        <p>Panel de control del almacenista</p>

        <span class="etiqueta-rol">ALMACENISTA</span>
    </header>

    <main class="contenido contenido-almacenista">

        <section class="panel panel-completo">
            <h2>Inventario de productos</h2>

            <p class="descripcion">
                Consulta las existencias y filtra los productos según su stock.
            </p>

            <div class="filtros">
                <button type="button" onclick="mostrarTodo()">
                    Mostrar todo
                </button>

                <button type="button" onclick="mostrarBajoStock()">
                    Stock menor a 10
                </button>

                <button type="button" onclick="mostrarAltoStock()">
                    Stock mayor a 20
                </button>
            </div>

            <p id="mensaje">Cargando inventario...</p>

            <div id="productos" class="lista-productos"></div>
        </section>

        <div class="acciones">
            <button type="button" onclick="cerrarSesion()">
                Cerrar sesión
            </button>
        </div>

    </main>

    <footer class="pie">
        REFACCIONARIA AGCM · Sistema de inventario
    </footer>

    <script src="../js/roles.js"></script>
    <script src="../js/inventario.js"></script>

</body>
</html>
